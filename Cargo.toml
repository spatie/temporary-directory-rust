[package]
name = "spatie-temporary-directory"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Quickly create, use and delete temporary directories"
license = "MIT"
keywords = ["temporary", "directory", "filesystem"]
categories = ["filesystem"]

[dependencies]
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
